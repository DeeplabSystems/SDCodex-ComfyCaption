{% extends "base.html" %}

{% block title %}SDCodex - Saved Gallery{% endblock %}

{% block styles %}
<style>
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 24px;
        margin-top: 20px;
    }

    .gallery-item {
        background: var(--card-bg, #fff);
        border: 1px solid var(--border, #eee);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        position: relative;
        user-select: none;
    }

    .gallery-item.selected {
        border: 2px solid var(--primary, #007bff);
        box-shadow: 0 0 12px rgba(0, 123, 255, 0.4);
    }

    .card-checkbox-wrap {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
    }

    .card-checkbox-wrap .form-check-input {
        width: 22px;
        height: 22px;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    [data-theme="dark"] .gallery-item {
        background: #1c1c1e;
        border-color: #333;
    }

    .gallery-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .item-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        cursor: pointer;
    }

    .item-content {
        padding: 16px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .item-caption {
        font-size: 14px;
        color: var(--text, #333);
        margin-bottom: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        flex-grow: 1;
    }

    [data-theme="dark"] .item-caption {
        color: #eee;
    }

    .item-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        border-top: 1px solid var(--border, #eee);
        padding-top: 10px;
    }

    [data-theme="dark"] .item-actions {
        border-top-color: #333;
    }

    .item-date {
        font-size: 12px;
        color: var(--text-secondary, #888);
    }

    /* Modal Styles */
    .gallery-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        backdrop-filter: blur(5px);
    }

    .gallery-modal-content {
        background: var(--card-bg, #fff);
        width: 90%;
        max-width: 1100px;
        height: 85vh;
        border-radius: 20px;
        display: grid;
        grid-template-columns: 1fr 350px;
        overflow: hidden;
        position: relative;
    }

    [data-theme="dark"] .gallery-modal-content {
        background: #1c1c1e;
    }

    @media (max-width: 800px) {
        .gallery-modal-content {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 200px;
            height: 95vh;
        }
    }

    .modal-image-view {
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .modal-image-view img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    .modal-info-panel {
        padding: 30px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    .modal-close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: rgba(255,255,255,0.2);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2001;
        font-size: 24px;
    }

    .modal-section-title {
        font-size: 12px;
        text-transform: uppercase;
        color: var(--primary, #007bff);
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    .loading-state {
        text-align: center;
        padding: 50px;
        color: var(--text-secondary, #888);
    }
</style>
{% endblock %}

{% block content %}
<div class="container mb-5">
    <div class="p-3 mb-4 rounded border bg-body-tertiary shadow-sm">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
            <div>
                <h1 class="h3 mb-1"><i class="fas fa-images text-primary me-2"></i>Saved Gallery</h1>
                <div id="count-text" class="text-secondary small fw-semibold">0 images</div>
            </div>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <label for="gallery-filter-select" class="form-label mb-0 small fw-bold text-secondary">Gallery:</label>
                <select id="gallery-filter-select" class="form-select form-select-sm" style="width: auto; min-width: 160px;">
                    <option value="all">All Galleries</option>
                </select>
                <button id="create-gallery-btn" class="btn btn-sm btn-primary" title="Create New Gallery">
                    <i class="fas fa-plus me-1"></i>New Gallery
                </button>
                <button id="delete-gallery-btn" class="btn btn-sm btn-outline-danger" style="display: none;" title="Delete this Gallery">
                    <i class="fas fa-trash me-1"></i>Delete Gallery
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 pt-3 border-top">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <button id="select-all-saved-btn" class="btn btn-sm btn-outline-secondary"><i class="fas fa-check-square me-1"></i>Select All</button>
                <button id="deselect-all-saved-btn" class="btn btn-sm btn-outline-secondary"><i class="fas fa-square me-1"></i>Deselect All</button>
                <span id="saved-selected-badge" class="badge bg-primary me-2" style="font-size: 12px; padding: 6px 10px;">0 selected</span>
                
                <div class="d-flex align-items-center gap-2 border-start ps-3 flex-wrap">
                    <span class="small text-secondary fw-semibold">Action:</span>
                    <select id="move-target-gallery-select" class="form-select form-select-sm" style="width: auto; min-width: 140px;">
                        <option value="">Move to...</option>
                    </select>
                    <button id="move-selected-btn" class="btn btn-sm btn-outline-primary" disabled><i class="fas fa-exchange-alt me-1"></i>Move Selected</button>
                    <button id="delete-selected-btn" class="btn btn-sm btn-outline-danger" disabled><i class="fas fa-trash-alt me-1"></i>Delete Selected</button>
                </div>
            </div>

            <div class="pagination d-flex align-items-center gap-2">
                <select id="items-per-page" class="form-select form-select-sm" style="width: auto;">
                    <option value="20">20 / page</option>
                    <option value="50">50 / page</option>
                    <option value="100">100 / page</option>
                </select>
                <button id="prev-btn" class="btn btn-sm btn-secondary" disabled>Previous</button>
                <span id="page-info" class="small fw-bold px-2">Page 1 of 1</span>
                <button id="next-btn" class="btn btn-sm btn-secondary" disabled>Next</button>
            </div>
        </div>
    </div>

    <div id="gallery-container" class="gallery-grid">
        <div class="loading-state col-12" style="grid-column: 1 / -1;">
            Loading saved images...
        </div>
    </div>
</div>

<!-- Detailed Modal -->
<div id="detail-modal" class="gallery-modal">
    <div class="modal-close-btn" onclick="closeDetailModal()">×</div>
    <div class="gallery-modal-content">
        <div class="modal-image-view">
            <img id="detail-img" src="" alt="Full view">
        </div>
        <div class="modal-info-panel">
            <h5 id="detail-filename" style="word-break: break-all; margin-bottom: 20px;">Filename</h5>
            
            <div class="modal-section-title">Caption</div>
            <div id="detail-caption" style="font-size: 15px; margin-bottom: 15px; white-space: pre-wrap;"></div>
            
            <div class="modal-section-title">SD Prompt</div>
            <div id="detail-sd-prompt" style="font-size: 13px; font-style: italic; margin-bottom: 15px;"></div>
            
            <div class="modal-section-title">SD Negative Prompt</div>
            <div id="detail-sd-negative" style="font-size: 13px; font-style: italic; margin-bottom: 15px;"></div>
            
            <div class="modal-section-title">Generation Info</div>
            <div id="detail-sd-setting" style="font-size: 12px; font-family: monospace; white-space: pre-wrap; margin-bottom: 20px;"></div>
            
            <div class="modal-action-buttons mt-auto d-flex flex-column gap-2">
                <button id="detail-caption-btn" class="btn btn-success"><i class="fas fa-magic me-1"></i>Caption this Image</button>
                <button id="detail-delete-btn" class="btn btn-danger"><i class="fas fa-trash me-1"></i>Delete from Gallery</button>
            </div>
        </div>
    </div>
</div>


<script>
    let savedImages = [];
    let currentDetailedImageId = null;
    let currentPage = 1;
    let itemsPerPage = 20;
    let selectedSavedImageIds = new Set();

    const itemsPerPageSelect = document.getElementById('items-per-page');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');
    const countText = document.getElementById('count-text');
    const galleryFilterSelect = document.getElementById('gallery-filter-select');
    const createGalleryBtn = document.getElementById('create-gallery-btn');
    const deleteGalleryBtn = document.getElementById('delete-gallery-btn');

    const selectAllSavedBtn = document.getElementById('select-all-saved-btn');
    const deselectAllSavedBtn = document.getElementById('deselect-all-saved-btn');
    const savedSelectedBadge = document.getElementById('saved-selected-badge');
    const moveTargetGallerySelect = document.getElementById('move-target-gallery-select');
    const moveSelectedBtn = document.getElementById('move-selected-btn');
    const deleteSelectedBtn = document.getElementById('delete-selected-btn');

    const updateSelectedSavedBadge = () => {
        const count = selectedSavedImageIds.size;
        savedSelectedBadge.innerText = `${count} selected`;
        moveSelectedBtn.disabled = count === 0 || !moveTargetGallerySelect.value;
        deleteSelectedBtn.disabled = count === 0;
    };

    const toggleSelectSavedImage = (id, forceState) => {
        if (forceState !== undefined) {
            if (forceState) selectedSavedImageIds.add(id);
            else selectedSavedImageIds.delete(id);
        } else {
            if (selectedSavedImageIds.has(id)) selectedSavedImageIds.delete(id);
            else selectedSavedImageIds.add(id);
        }
        updateSelectedSavedBadge();
        const card = document.getElementById(`saved-card-${id}`);
        if (card) {
            if (selectedSavedImageIds.has(id)) card.classList.add('selected');
            else card.classList.remove('selected');
            const chk = card.querySelector('.saved-img-checkbox');
            if (chk) chk.checked = selectedSavedImageIds.has(id);
        }
    };

    selectAllSavedBtn.onclick = () => {
        savedImages.forEach(img => selectedSavedImageIds.add(img.id));
        savedImages.forEach(img => {
            const card = document.getElementById(`saved-card-${img.id}`);
            if (card) {
                card.classList.add('selected');
                const chk = card.querySelector('.saved-img-checkbox');
                if (chk) chk.checked = true;
            }
        });
        updateSelectedSavedBadge();
    };

    deselectAllSavedBtn.onclick = () => {
        selectedSavedImageIds.clear();
        savedImages.forEach(img => {
            const card = document.getElementById(`saved-card-${img.id}`);
            if (card) {
                card.classList.remove('selected');
                const chk = card.querySelector('.saved-img-checkbox');
                if (chk) chk.checked = false;
            }
        });
        updateSelectedSavedBadge();
    };

    moveTargetGallerySelect.onchange = updateSelectedSavedBadge;

    const loadGalleriesList = async () => {
        try {
            const res = await fetch('/api/galleries');
            const data = await res.json();
            const currFilterVal = galleryFilterSelect.value;
            const currMoveVal = moveTargetGallerySelect.value;

            galleryFilterSelect.innerHTML = '<option value="all">All Galleries</option>';
            moveTargetGallerySelect.innerHTML = '<option value="">Move to...</option>';

            data.forEach(g => {
                const optFilter = document.createElement('option');
                optFilter.value = g.id;
                optFilter.innerText = `${g.name} (${g.count})`;
                galleryFilterSelect.appendChild(optFilter);

                const optMove = document.createElement('option');
                optMove.value = g.id;
                optMove.innerText = g.name;
                moveTargetGallerySelect.appendChild(optMove);
            });

            if (currFilterVal && Array.from(galleryFilterSelect.options).some(o => o.value === currFilterVal)) {
                galleryFilterSelect.value = currFilterVal;
            }
            if (currMoveVal && Array.from(moveTargetGallerySelect.options).some(o => o.value === currMoveVal)) {
                moveTargetGallerySelect.value = currMoveVal;
            }
            updateDeleteGalleryButton();
        } catch (err) {
            console.error('Error fetching galleries list:', err);
        }
    };

    createGalleryBtn.onclick = async () => {
        const name = prompt('Enter a name for the new gallery:');
        if (!name || !name.trim()) return;
        try {
            const res = await fetch('/api/galleries', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.trim() })
            });
            const data = await res.json();
            if (res.ok) {
                await loadGalleriesList();
                galleryFilterSelect.value = data.id;
                updateDeleteGalleryButton();
                loadSavedGallery(1);
            } else {
                alert('Error creating gallery: ' + (data.error || 'Failed'));
            }
        } catch (err) {
            alert('Error creating gallery: ' + err.message);
        }
    };

    moveSelectedBtn.onclick = async () => {
        const targetId = moveTargetGallerySelect.value;
        if (!targetId) return alert('Please select a target gallery to move to');
        if (selectedSavedImageIds.size === 0) return alert('Please select at least one image');

        moveSelectedBtn.disabled = true;
        try {
            const res = await fetch('/api/gallery/move-selected', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image_ids: Array.from(selectedSavedImageIds),
                    target_gallery_id: targetId
                })
            });
            const data = await res.json();
            if (res.ok) {
                selectedSavedImageIds.clear();
                await loadGalleriesList();
                loadSavedGallery(currentPage);
            } else {
                alert('Error moving images: ' + (data.error || 'Failed'));
            }
        } catch (err) {
            alert('Error moving images: ' + err.message);
        } finally {
            moveSelectedBtn.disabled = false;
        }
    };

    deleteSelectedBtn.onclick = async () => {
        if (selectedSavedImageIds.size === 0) return alert('Please select at least one image');
        if (!confirm(`Are you sure you want to delete ${selectedSavedImageIds.size} selected image(s)?`)) return;

        deleteSelectedBtn.disabled = true;
        try {
            const res = await fetch('/api/gallery/delete-selected', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image_ids: Array.from(selectedSavedImageIds)
                })
            });
            const data = await res.json();
            if (res.ok) {
                selectedSavedImageIds.clear();
                await loadGalleriesList();
                loadSavedGallery(currentPage);
            } else {
                alert('Error deleting images: ' + (data.error || 'Failed'));
            }
        } catch (err) {
            alert('Error deleting images: ' + err.message);
        } finally {
            deleteSelectedBtn.disabled = false;
        }
    };

    const updateDeleteGalleryButton = () => {
        const val = galleryFilterSelect.value;
        const selectedOpt = galleryFilterSelect.options[galleryFilterSelect.selectedIndex];
        const isDefault = selectedOpt && selectedOpt.innerText.startsWith('Default Gallery');
        if (val !== 'all' && !isDefault) {
            deleteGalleryBtn.style.display = 'inline-block';
        } else {
            deleteGalleryBtn.style.display = 'none';
        }
    };

    galleryFilterSelect.onchange = () => {
        updateDeleteGalleryButton();
        loadSavedGallery(1);
    };

    deleteGalleryBtn.onclick = async () => {
        const galId = galleryFilterSelect.value;
        const selectedOpt = galleryFilterSelect.options[galleryFilterSelect.selectedIndex];
        const galName = selectedOpt ? selectedOpt.innerText : 'this gallery';
        if (confirm(`Are you sure you want to delete "${galName}" and all images in it?`)) {
            try {
                const res = await fetch(`/api/galleries/${galId}`, { method: 'DELETE' });
                if (res.ok) {
                    galleryFilterSelect.value = 'all';
                    await loadGalleriesList();
                    loadSavedGallery(1);
                } else {
                    const data = await res.json();
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Error deleting gallery: ' + err.message);
            }
        }
    };

    itemsPerPageSelect.onchange = () => {
        itemsPerPage = parseInt(itemsPerPageSelect.value);
        loadSavedGallery(1);
    };

    prevBtn.onclick = () => loadSavedGallery(currentPage - 1);
    nextBtn.onclick = () => loadSavedGallery(currentPage + 1);

    async function loadSavedGallery(page = 1) {
        currentPage = page;
        const container = document.getElementById('gallery-container');
        const galId = galleryFilterSelect.value;
        try {
            const url = `/api/gallery/saved?page=${page}&limit=${itemsPerPage}&gallery_id=${encodeURIComponent(galId)}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (!response.ok) throw new Error(data.error || 'Failed to load');
            
            savedImages = data.images || [];
            
            countText.innerText = `Total: ${data.total} images`;
            pageInfo.innerText = `Page ${data.page} of ${data.totalPages}`;
            prevBtn.disabled = data.page <= 1;
            nextBtn.disabled = data.page >= data.totalPages;
            
            if (savedImages.length === 0) {
                container.innerHTML = '<div class="loading-state col-12" style="grid-column: 1 / -1;">No images saved yet. Go to Captioning to save some!</div>';
                updateSelectedSavedBadge();
                return;
            }
            
            container.innerHTML = '';
            savedImages.forEach(img => {
                const date = img.created_at ? new Date(img.created_at).toLocaleDateString() : 'Unknown date';
                const isSelected = selectedSavedImageIds.has(img.id);
                
                const item = document.createElement('div');
                item.id = `saved-card-${img.id}`;
                item.className = `gallery-item ${isSelected ? 'selected' : ''}`;
                item.onclick = () => openDetailModal(img.id);
                item.innerHTML = `
                    <div class="card-checkbox-wrap" onclick="event.stopPropagation(); toggleSelectSavedImage(${img.id});">
                        <input type="checkbox" class="form-check-input saved-img-checkbox" ${isSelected ? 'checked' : ''}>
                    </div>
                    <img class="item-image" src="${img.image_path}" alt="${img.file_name}">
                    <div class="item-content">
                        <div class="item-caption">${img.caption || 'No caption'}</div>
                        <div class="item-actions">
                            <span class="item-date">${date}</span>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteImage(${img.id}, event)"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
            updateSelectedSavedBadge();
            
        } catch (error) {
            container.innerHTML = `<div class="loading-state col-12" style="grid-column: 1 / -1; color: red;">Error: ${error.message}</div>`;
        }
    }

    function openDetailModal(id) {
        const img = savedImages.find(i => i.id === id);
        if (!img) return;
        
        currentDetailedImageId = id;
        document.getElementById('detail-img').src = img.image_path;
        document.getElementById('detail-filename').textContent = img.file_name;
        document.getElementById('detail-caption').textContent = img.caption || 'No caption available.';
        document.getElementById('detail-sd-prompt').textContent = img.sd_prompt || 'N/A';
        document.getElementById('detail-sd-negative').textContent = img.sd_negative || 'N/A';
        document.getElementById('detail-sd-setting').textContent = img.sd_setting || 'N/A';
        
        document.getElementById('detail-modal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeDetailModal() {
        document.getElementById('detail-modal').style.display = 'none';
        document.body.style.overflow = 'auto';
        currentDetailedImageId = null;
    }

    document.getElementById('detail-caption-btn').onclick = async () => {
        if (!currentDetailedImageId) return;
        const btn = document.getElementById('detail-caption-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Captioning...';
        btn.disabled = true;

        try {
            const res = await fetch(`/api/gallery/saved/${currentDetailedImageId}/caption`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: 'Caption this image',
                    lmStudioUrl: localStorage.getItem('lmStudioUrl') || 'http://localhost:1234/v1'
                })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('detail-caption').textContent = data.caption;
                const img = savedImages.find(i => i.id === currentDetailedImageId);
                if (img) img.caption = data.caption;
                const card = document.getElementById(`saved-card-${currentDetailedImageId}`);
                if (card) {
                    const cap = card.querySelector('.item-caption');
                    if (cap) cap.textContent = data.caption;
                }
            } else {
                alert('Error generating caption: ' + (data.error || 'Failed'));
            }
        } catch (err) {
            alert('Error generating caption: ' + err.message);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    };

    document.getElementById('detail-delete-btn').onclick = async () => {
        if (currentDetailedImageId && confirm('Are you sure you want to delete this image?')) {
            await deleteImage(currentDetailedImageId);
            closeDetailModal();
        }
    };


    async function deleteImage(id, event) {
        if (event) event.stopPropagation();
        else if (!confirm('Delete this saved image?')) return;
        
        try {
            const res = await fetch(`/api/gallery/saved/${id}`, { method: 'DELETE' });
            if (res.ok) {
                selectedSavedImageIds.delete(id);
                loadSavedGallery(currentPage);
                loadGalleriesList();
            } else {
                const data = await res.json();
                alert('Error: ' + data.error);
            }
        } catch (err) {
            alert('Error deleting image: ' + err.message);
        }
    }

    document.getElementById('detail-modal').onclick = (e) => {
        if (e.target.id === 'detail-modal') closeDetailModal();
    };

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('detail-modal').style.display === 'flex') {
            closeDetailModal();
        }
    });

    // Load on init
    (async () => {
        await loadGalleriesList();
        loadSavedGallery();
    })();
</script>
{% endblock %}
